  </div>`;
  window.print();
}

/* ================================================================
   22. ACTIONS (event delegation)
   ================================================================ */
document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-page]');
  const el = e.target.closest('[data-action]');

  if (navBtn && !el) {
    if (navBtn.dataset.page === 'settings') settingsSection = null;
    go(navBtn.dataset.page); return;
  }
  if (navBtn && el && el.dataset.action === '') { go(navBtn.dataset.page); return; }
  if (navBtn) {
    if (navBtn.dataset.page === 'settings') settingsSection = null;
    go(navBtn.dataset.page); return;
  }
  if (!el) return;

  const a = el.dataset.action;
  const id = el.dataset.id;

  switch (a) {
    /* ---------- shell ---------- */
    case 'toggle-sidebar': $('#sidebar').classList.toggle('open'); break;
    case 'logout': logout(); break;
    case 'close-modal': closeModal(); break;

    /* ---------- SETTINGS NAVIGATION (NEW) ---------- */
    case 'settings-open': settingsSection = el.dataset.v; go('settings'); break;
    case 'settings-back': settingsSection = null; go('settings'); break;

    case 'notifications': {
      const np = $('#notifPanel');
      if (!np.classList.contains('hidden')) { np.classList.add('hidden'); break; }
      const alerts = [
        ...expiredStock().map(i => ({ t:'red', h:`🔴 Expired: <b>${esc(i.name)}</b> batch ${esc(i.batch)}`, p:'inventory' })),
        ...expiringSoon().map(i => ({ t:'amber', h:`🟠 Expiring soon: <b>${esc(i.name)}</b> — ${fmtDate(i.expiry)}`, p:'inventory' })),
        ...lowStock().map(i => ({ t:'blue', h:`🟡 Low stock: <b>${esc(i.name)}</b> — ${i.qty} left`, p:'inventory' })),
        ...dueFollowups().slice(0,5).map(f => ({ t:'blue', h:`🔔 Follow-up: <b>${esc(patientName(f.patientId))}</b>`, p:'followups' })),
        ...pendingReports().map(r => ({ t:'amber', h:`🧪 Pending report: <b>${esc(r.type)}</b> — ${esc(patientName(r.patientId))}`, p:'reports' }))
      ];
      np.innerHTML = alerts.length
        ? `<div style="padding:10px 12px;font-weight:800;font-size:12px;letter-spacing:.8px;color:#8b9aae">NOTIFICATIONS</div>` +
          alerts.map(x => `<div class="list-row" data-page="${x.p}" style="font-size:13px;padding:10px 12px">
            <div style="flex:1">${x.h}</div></div>`).join('')
        : `<div class="empty"><span class="e">🔔</span>You're all caught up</div>`;
      np.classList.remove('hidden');
      break;
    }
    case 'profile-menu':
      openModal('👤 Profile', `
        <div style="text-align:center;padding:8px 0 18px">
          <div class="avatar" style="width:78px;height:78px;border-radius:22px;font-size:26px;margin:0 auto 14px">UK</div>
          <h3 style="font-size:18px;color:#0d2b3e">${esc(DB.settings.doctor)}</h3>
          <p style="font-size:12.5px;color:var(--muted);margin-top:4px">${esc(DB.settings.qualification)}<br>Reg. No: ${esc(DB.settings.regNo)}</p>
        </div>
        <div class="alert-row blue" style="margin-bottom:8px">🏥 ${esc(DB.settings.clinicName)}</div>
        <div class="alert-row blue" style="margin-bottom:8px">📞 ${esc(DB.settings.phone)}</div>
        <div class="alert-row blue">🕘 ${esc(DB.settings.timings)}</div>`,
        `<button class="btn ghost" data-action="close-modal">Close</button>
         <button class="btn primary" data-action="logout">⎋ Logout</button>`);
      break;

    /* ---------- patients ---------- */
    case 'new-patient': modalNewPatient(null); break;
    case 'edit-patient': modalNewPatient(P(id)); break;
    case 'open-patient': closeModal(); go('patients'); profileTab = 'overview'; $('#content').innerHTML = renderPatientProfile(id); break;
    case 'profile-tab': {
      profileTab = el.dataset.tab;
      const pid = currentProfileId();
      $('#content').innerHTML = renderPatientProfile(pid);
      break;
    }
    case 'save-patient': savePatient(id); break;

    /* ---------- consultation ---------- */
    case 'start-consult': {
      closeModal();
      const pid = id || (todayQueue().find(q => q.status === 'current') || {}).patientId;
      if (!pid) { toast('Select a patient first', 'warn'); break; }
      C = newDraft(pid);
      go('consultation', pid);
      break;
    }
    case 'end-consult': C = null; go('dashboard'); break;
    case 'toggle-complaint': {
      syncDraftFromDOM();
      const v = el.dataset.v;
      C.complaints = C.complaints.includes(v) ? C.complaints.filter(x => x !== v) : [...C.complaints, v];
      go('consultation', C.patientId);
      break;
    }
    case 'add-med': {
      syncDraftFromDOM();
      C.meds.push({ name:'', dose:'1 tab', freq:'1-0-1', dur:'5 days', note:'After food' });
      go('consultation', C.patientId);
      setTimeout(() => { const rows = $$('#medListBody .med-row'); const last = rows[rows.length-1]; if (last) last.querySelector('.m-name').focus(); }, 80);
      break;
    }
    case 'remove-med': {
      syncDraftFromDOM();
      C.meds.splice(Number(el.dataset.i), 1);
      go('consultation', C.patientId);
      break;
    }
    case 'add-investigation': {
      syncDraftFromDOM();
      C.investigations.push('');
      go('consultation', C.patientId);
      break;
    }
    case 'remove-investigation': {
      syncDraftFromDOM();
      C.investigations.splice(Number(el.dataset.i), 1);
      go('consultation', C.patientId);
      break;
    }
    case 'calc-bmi': {
      const w = parseFloat(($('[data-vital="weight"]') || {}).value);
      const h = parseFloat(($('[data-vital="height"]') || {}).value);
      if (!w || !h) { toast('Enter weight and height first', 'warn'); break; }
      const bmi = (w / Math.pow(h / 100, 2)).toFixed(1);
      const cat = bmi < 18.5 ? 'Underweight' : bmi < 25 ? 'Normal' : bmi < 30 ? 'Overweight' : 'Obese';
      $('#bmiOut').textContent = `BMI ${bmi} kg/m² — ${cat}`;
      break;
    }
    case 'rx-template': openTemplatePicker(); break;
    case 'voice-example': {
      $('#voiceRaw').value = 'রোগীর তিন দিন ধরে জ্বর এবং হালকা কাশি রয়েছে। সাথে গা ব্যথা আছে। বিশ্রাম নিতে বলেছেন।';
      toast('Example loaded — press Convert', 'ok');
      break;
    }
    case 'voice-vitals': {
      $('#voiceRaw').value = 'ব্লাড প্রেসার একশো পঞ্চাশ বাই নব্বই, পালস বিরাশি, তাপমাত্রা একশো এক, ওজন ছিয়াত্তর কেজি।';
      toast('Voice vitals example loaded — press Convert', 'ok');
      break;
    }
    case 'voice-followup': {
      $('#voiceRaw').value = 'সাত দিন পরে আবার দেখাবেন।';
      toast('Follow-up example loaded — press Convert', 'ok');
      break;
    }
    case 'translate-voice': {
      const raw = $('#voiceRaw').value.trim();
      if (!raw) { toast('Speak or type something in Bengali first', 'warn'); break; }
      const vitals = parseVitalsBN(raw);
      const fu = parseFollowupBN(raw);
      const en = bnToEnglish(raw);
      $('#cVoiceOut').value = en;
      if (Object.keys(vitals).length) {
        Object.entries(vitals).forEach(([k, v]) => { const f = $(`[data-vital="${k}"]`); if (f) f.value = v; });
        toast('Vitals detected and filled: ' + Object.keys(vitals).join(', '), 'ok');
      }
      if (fu) { const sel = $('#cFollowUp'); if (sel) { const opt = [...sel.options].find(o => o.value === fu); if (opt) sel.value = fu; } }
      if (!Object.keys(vitals).length && !fu) toast('Converted to English clinical note', 'ok');
      break;
    }
    case 'save-consult': saveConsultation(false, false); break;
    case 'save-consult-bill': saveConsultation(true, false); break;
    case 'save-consult-print': saveConsultation(false, true); break;
    case 'print-rx': printPrescription(id); break;
    case 'reuse-rx': {
      const c = DB.consultations.find(x => x.id === id);
      if (!c) break;
      C = newDraft(c.patientId);
      C.meds = JSON.parse(JSON.stringify(c.meds || []));
      C.investigations = [...(c.investigations || [])];
      C.diagnosis = c.diagnosis || '';
      C.advice = c.advice || '';
      C.followUp = c.followUp || '';
      go('consultation', c.patientId);
      toast('Previous prescription loaded for review', 'ok');
      break;
    }

    /* ---------- queue ---------- */
    case 'call-token': callToken(id); break;
    case 'call-next': callNext(); break;
    case 'add-token': addToken(); break;
    case 'skip-token': {
      const cur = todayQueue().find(q => q.status === 'current');
      if (cur) { cur.status = 'waiting'; saveDB(); toast('Token skipped', 'warn'); go('queue'); }
      break;
    }
    case 'complete-token': {
      const it = DB.queue.find(x => x.id === id);
      if (it) { it.status = 'done'; saveDB(); toast('Consultation completed', 'ok'); }
      go('queue');
      break;
    }

    /* ---------- appointments ---------- */
    case 'new-appointment': modalNewAppointment(); break;
    case 'save-appointment': saveAppointment(); break;
    case 'appt-view': apptView = el.dataset.v; go('appointments'); break;
    case 'appt-complete': { const x = DB.appointments.find(v => v.id === id); if (x) { x.status = 'Completed'; saveDB(); toast('Marked completed', 'ok'); } go('appointments'); break; }
    case 'appt-cancel': { const x = DB.appointments.find(v => v.id === id); if (x) { x.status = 'Cancelled'; saveDB(); toast('Appointment cancelled', 'warn'); } go('appointments'); break; }

    /* ---------- billing ---------- */
    case 'new-bill': modalNewBill(id || null); break;
    case 'bill-add-item': billItems.push({ desc:'', amt:0 }); renderBillItems(); break;
    case 'bill-remove-item': billItems.splice(Number(el.dataset.i), 1); renderBillItems(); break;
    case 'save-bill': saveBill(); break;
    case 'print-bill': printBill(id); break;
    case 'pay-bill': {
      const b = DB.bills.find(x => x.id === id);
      if (!b) break;
      openModal('💰 Record Payment', `
        <div class="alert-row blue" style="margin-bottom:14px">Invoice <b>${esc(b.no)}</b> · Total ${money(b.total)} · Balance <b>${money(b.total - b.paid)}</b></div>
        <div class="form-grid">
          <div class="field"><label>Amount (₹)</label><input id="payAmt" type="number" value="${b.total - b.paid}"></div>
          <div class="field"><label>Method</label><select id="payMethod">${['Cash','UPI','Card','Bank transfer','Other'].map(m => `<option>${m}</option>`).join('')}</select></div>
        </div>`,
        `<button class="btn ghost" data-action="close-modal">Cancel</button>
         <button class="btn primary" data-action="confirm-pay" data-id="${b.id}">✓ Record Payment</button>`);
      break;
    }
    case 'confirm-pay': {
      const b = DB.bills.find(x => x.id === id);
      const amt = Number($('#payAmt').value) || 0;
      b.paid = Math.min(b.total, b.paid + amt);
      b.method = $('#payMethod').value;
      b.status = b.paid >= b.total ? 'Paid' : 'Partial';
      saveDB(); closeModal(); toast('Payment recorded', 'ok'); go('billing');
      break;
    }

    /* ---------- inventory ---------- */
    case 'new-stock': modalStock(null); break;
    case 'stock-edit': modalStock(DB.inventory.find(i => i.id === id)); break;
    case 'stock-add': {
      const it = DB.inventory.find(i => i.id === id);
      if (it) { it.qty += 10; saveDB(); toast('+10 ' + it.unit + ' added to ' + it.name, 'ok'); go('inventory'); }
      break;
    }
    case 'stock-del': {
      if (confirm('Delete this stock item?')) {
        DB.inventory = DB.inventory.filter(i => i.id !== id); saveDB(); toast('Item deleted', 'warn'); go('inventory');
      }
      break;
    }
    case 'save-stock': saveStock(id); break;

    /* ---------- reports ---------- */
    case 'new-report': modalNewReport(); break;
    case 'save-report': saveReport(); break;
    case 'open-report': {
      const r = DB.reports.find(x => x.id === id);
      if (r && r.data) window.open(r.data, '_blank');
      else toast('No file attached', 'warn');
      break;
    }
    case 'report-done': { const r = DB.reports.find(x => x.id === id); if (r) { r.status = 'Completed'; saveDB(); toast('Report marked completed', 'ok'); } go('reports'); break; }

    /* ---------- follow-ups ---------- */
    case 'new-followup': modalNewFollowup(); break;
    case 'save-followup': saveFollowup(); break;
    case 'followup-done': { const f = DB.followups.find(x => x.id === id); if (f) { f.done = true; saveDB(); toast('Follow-up completed', 'ok'); } go('followups'); break; }

    /* ---------- documents ---------- */
    case 'gen-doc': openPatientPickerForDoc(el.dataset.v); break;
    case 'run-doc': printDocument(el.dataset.v, el.dataset.id); closeModal(); break;
    case 'patient-summary': printDocument('summary', id); break;

    /* ---------- settings ---------- */
    case 'save-settings': saveSettings(); break;
    case 'backup': downloadBackup(); break;
    case 'restore': $('#restoreFile').click(); break;
    case 'export-csv': exportPatientsCSV(); break;
    case 'reset-settings': {
      if (confirm('Restore default settings? Patient records will NOT be touched.')) {
        DB.settings = { ...SETTINGS_DEFAULTS, billFields: { ...SETTINGS_DEFAULTS.billFields } };
        saveDB(); toast('Default settings restored', 'ok'); go('settings');
      }
      break;
    }
    case 'reset-one': {
      const key = el.dataset.v;
      const groups = {
        clinic: ['clinicName','tagline','doctor','qualification','specialization','regNo','regCouncil','experience','address','area','city','state','pincode','phone','whatsapp','email','timings','closedDay'],
        bill: ['billPrefix','billStartNo','billAutoNo','billShowDate','billShowTime','billHeader','billSubtitle','billFooter','billPaymentNote','billExtraNote','billStyle','billLogoPos','billDocPos','billPatientLayout','billSigPos','billShowContact','billShowPayment','billShowInvNo','billShowQR'],
        prescription: ['rxShowLogo','rxShowDoctor','rxShowRegNo','rxShowAddress','rxShowPhone','rxShowSignature','rxShowFooter','rxShowAdvice','rxShowFollowup','rxShowMedTable','rxShowDiagnosis','rxShowPatientId'],
        voice: ['voiceInputLang','voiceOutputLang','voiceEnabled','voiceTranslate','voiceClinical','voiceSensitivity','voiceMic','voiceAutoStart','voiceAutoStop','voiceConfirm'],
        appearance: ['theme','uiDensity','fontSize']
      };
      const keys = groups[key] || [];
      if (!keys.length) { toast('Nothing to reset', 'warn'); break; }
      keys.forEach(k => { DB.settings[k] = SETTINGS_DEFAULTS[k]; });
      if (key === 'bill') DB.settings.billFields = { ...SETTINGS_DEFAULTS.billFields };
      saveDB(); toast('Section restored to defaults', 'ok'); go('settings');
      break;
    }
    case 'reset-demo': {
      if (confirm('⚠ Reset ALL data — patients, consultations, bills, reports. Continue?')) {
        if (confirm('This is permanent. Download a backup first? Press OK to confirm the reset.')) {
          DB = defaultDB(); saveDB(); buildNav(); go('dashboard'); toast('All data reset to demo', 'ok');
        }
      }
      break;
    }
    case 'archive-patient-picker': {
      openModal('📁 Archive a patient', `
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Archived patients are hidden from lists but remain in your backup.</p>
        ${DB.patients.map(p => `
          <div class="list-row" data-action="archive-patient" data-id="${p.id}">
            <div class="avatar">${initials(p.name)}</div>
            <div class="meta"><b>${esc(p.name)}</b><small>${esc(p.id)}</small></div>
            <span class="badge gray">Archive</span>
          </div>`).join('')}`);
      break;
    }
    case 'archive-patient': {
      const p = P(id); if (!p) break;
      if (confirm('Archive ' + p.name + '? They will be hidden from active lists.')) {
        DB.archived.push(p);
        DB.patients = DB.patients.filter(x => x.id !== id);
        saveDB(); closeModal(); toast('Patient archived', 'warn'); go('settings');
        settingsSection = 'datamanage';
        $('#content').innerHTML = renderSettingsSection('datamanage');
      }
      break;
    }
    case 'unarchive-patient': {
      const idx = DB.archived.findIndex(x => x.id === id);
      if (idx < 0) break;
      DB.patients.push(DB.archived[idx]);
      DB.archived.splice(idx, 1);
      saveDB(); toast('Patient restored', 'ok');
      settingsSection = 'datamanage';
      $('#content').innerHTML = renderSettingsSection('datamanage');
      break;
    }
    case 'merge-patients': {
      toast('Merge tool requires matching by mobile — use duplicate detection on registration', 'warn');
      break;
    }
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'easyToggle') {
    DB.settings.easyMode = e.target.checked;
    saveDB(); buildNav();
    toast(DB.settings.easyMode ? 'Easy Mode enabled' : 'Advanced mode enabled', 'ok');
  }
  if (e.target.id === 'restoreFile') {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data.patients) throw new Error('bad file');
        DB = data;
        DB.settings = { ...SETTINGS_DEFAULTS, ...(DB.settings || {}), billFields: { ...SETTINGS_DEFAULTS.billFields, ...((DB.settings||{}).billFields||{}) } };
        DB.archived = DB.archived || [];
        saveDB(); buildNav(); go('dashboard'); toast('Backup restored successfully', 'ok');
      } catch (err) { toast('Invalid backup file', 'err'); }
    };
    rd.readAsText(f);
  }
  if (e.target.id === 'bDiscount' || e.target.id === 'bPaid') recalcBill();

  /* ---------- NEW: settings file uploads (photo / signature / logo) ---------- */
  if (e.target.dataset && e.target.dataset.settingsFile) {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 200000) { toast('File too large (max 200 KB)', 'err'); return; }
    const key = e.target.dataset.settingsFile;
    const rd = new FileReader();
    rd.onload = () => { DB.settings[key] = rd.result; saveDB(); toast('Uploaded successfully', 'ok');
      if (currentPage === 'settings' && settingsSection) {
        $('#content').innerHTML = renderSettingsSection(settingsSection);
      }
    };
    rd.readAsDataURL(f);
  }
});

/* ================================================================
   23. SAVE HANDLERS
   ================================================================ */
function currentProfileId() {
  const badge = $('#content .badge.blue');
  const m = badge && badge.textContent.match(/ARO-\d{4}-\d{6}/);
  return m ? m[0] : (DB.patients[0] || {}).id;
}

function savePatient(existingId) {
  const name = $('#pName').value.trim();
  const mobile = $('#pMobile').value.trim();
  if (!name) { toast('Patient name is required', 'err'); return; }
  if (!mobile) { toast('Mobile number is required', 'err'); return; }

  const data = {
    name, mobile,
    dob: $('#pDob').value,
    age: Number($('#pAge').value) || ageFromDOB($('#pDob').value) || '',
    gender: $('#pGender').value,
    address: $('#pAddress').value.trim(),
    blood: $('#pBlood').value,
    abha: $('#pAbha').value.trim(),
    allergies: $('#pAllergies').value.trim() || 'None known',
    conditions: $('#pConditions').value.trim() || '—',
    medicines: $('#pMedicines').value.trim() || '—',
    surgeries: $('#pSurgeries').value.trim() || '—',
    family: $('#pFamily').value.trim() || '—',
    emergency: $('#pEmergency').value.trim(),
    notes: $('#pNotes').value.trim()
  };

  if (existingId) {
    const p = P(existingId);
    Object.assign(p, data);
    saveDB(); closeModal(); toast('Patient updated', 'ok');
    go('patients'); profileTab = 'overview';
    $('#content').innerHTML = renderPatientProfile(existingId);
  } else {
    const dup = DB.patients.find(x => x.mobile === mobile);
    if (dup && !confirm(`A patient with this mobile already exists (${dup.name}). Register anyway?`)) return;
    DB.counters.patient++;
    const newId = nextPatientId();
    DB.patients.push({ id: newId, ...data, createdAt: todayISO() });
    saveDB(); closeModal();
    toast('Patient registered · ' + newId, 'ok');
    go('patients'); profileTab = 'overview';
    $('#content').innerHTML = renderPatientProfile(newId);
  }
}

function saveConsultation(makeBill, doPrint) {
  syncDraftFromDOM();
  if (!C.diagnosis.trim()) { toast('Please enter a diagnosis before saving', 'err'); return; }

  DB.counters.cons++;
  const cons = {
    id: uid('C'), patientId: C.patientId, date: todayISO(),
    complaints: C.complaints, symptoms: C.symptoms, history: C.history,
    examination: C.examination, vitals: C.vitals, diagnosis: C.diagnosis,
    investigations: C.investigations, meds: C.meds, advice: C.advice,
    followUp: C.followUp, notes: (C.notes + (C.voiceText ? '\n\nClinical note: ' + C.voiceText : '')).trim(),
    createdAt: todayISO()
  };
  DB.consultations.push(cons);

  if (C.followUp) {
    const days = parseInt(C.followUp);
    if (!isNaN(days)) {
      DB.followups.push({ id: uid('F'), patientId: C.patientId, date: shiftISO(days), time: '', note: 'Auto from consultation', done: false });
    }
  }

  const q = todayQueue().find(x => x.patientId === C.patientId && x.status !== 'done');
  if (q) q.status = 'done';

  saveDB();
  toast('Consultation saved successfully', 'ok');

  const pid = C.patientId;
  const consId = cons.id;
  C = null;

  if (makeBill) { modalNewBill(pid); return; }
  if (doPrint) { setTimeout(() => printPrescription(consId), 250); }
  go('patients'); profileTab = 'visits';
  $('#content').innerHTML = renderPatientProfile(pid);
}

function saveBill() {
  const pid = $('#bPatient').value;
  if (!pid) { toast('Please select a patient', 'err'); return; }
  const items = billItems.filter(i => i.desc && Number(i.amt) > 0);
  if (!items.length) { toast('Add at least one service', 'err'); return; }
  const sub = items.reduce((s, i) => s + Number(i.amt), 0);
  const disc = Number($('#bDiscount').value) || 0;
  const total = Math.max(0, sub - disc);
  const paid = Number($('#bPaid').value) || 0;

  DB.counters.bill++;
  const s = DB.settings;
  const bill = {
    id: uid('B'),
    no: `${s.billPrefix}/${new Date().getFullYear()}/${String(DB.counters.bill + s.billStartNo - 1).padStart(5,'0')}`,
    patientId: pid, date: $('#bDate').value, items, discount: disc, total, paid,
    method: $('#bMethod').value, status: paid >= total ? 'Paid' : paid > 0 ? 'Partial' : 'Unpaid',
    createdAt: todayISO()
  };
  DB.bills.push(bill);
  saveDB(); closeModal(); toast('Invoice ' + bill.no + ' created', 'ok');
  go('billing');
  setTimeout(() => printBill(bill.id), 320);
}

/* ---------- Backup / export ---------- */
function downloadBackup() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'arogya-clinic-backup-' + todayISO() + '.json';
  a.click();
  URL.revokeObjectURL(url);
  localStorage.setItem('arogya_last_backup', todayISO());
  $('#backupText').textContent = 'Backup: today';
  toast('Backup downloaded', 'ok');
}

function exportPatientsCSV() {
  const rows = [['Patient ID','Name','Age','Gender','Mobile','Blood','Allergies','Conditions','Registered']];
  DB.patients.forEach(p => rows.push([p.id, p.name, p.age, p.gender, p.mobile, p.blood || '', p.allergies || '', p.conditions || '', p.createdAt || '']));
  const csv = rows.map(r => r.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'arogya-patients-' + todayISO() + '.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('Patients exported to CSV', 'ok');
}

const searchInput = $('#globalSearch');
const searchResults = $('#searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) { searchResults.classList.add('hidden'); return; }
  const hits = DB.patients.filter(p =>
    p.name.toLowerCase().includes(q) || p.mobile.includes(q) || p.id.toLowerCase().includes(q) ||
    (p.abha || '').toLowerCase().includes(q) || (p.dob || '').includes(q)).slice(0, 8);

  searchResults.innerHTML = hits.length
    ? hits.map(p => {
        const last = patientConsults(p.id)[0];
        return `<div class="sr-item" data-action="open-patient" data-id="${p.id}">
          <div class="sr-avatar">${initials(p.name)}</div>
          <div style="flex:1;min-width:0"><b>${esc(p.name)}</b>
            <small>${esc(p.id)} · ${esc(p.age || '—')} yrs · ${esc(p.gender || '')}</small>
            <small style="display:block">Last visit: ${last ? fmtDate(last.date) : '—'}</small></div>
          <span class="badge gray">Open →</span>
        </div>`;
      }).join('')
    : `<div class="empty" style="padding:22px"><span class="e">🔍</span>No patient found<br>
        <button class="btn primary sm" style="margin-top:12px" data-action="new-patient">➕ Register new patient</button></div>`;
  searchResults.classList.remove('hidden');
});

document.addEventListener('click', e => {

  if (np && np.closest('#notifPanel')) { $('#notifPanel').classList.add('hidden'); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'patientSearch') {
    patientFilter = e.target.value;
    const pos = e.target.selectionStart;
    go('patients');
    const el = $('#patientSearch');
    if (el) { el.focus(); el.setSelectionRange(pos, pos); }
  }
});

/* ================================================================
   25. VOICE RECOGNITION
   ================================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, listening = false;

function initVoice() {
  if (!SR) return;
  recognition = new SR();
  recognition.lang = DB.settings.voiceInputLang || 'bn-IN';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = (ev) => {
    let text = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) text += ev.results[i][0].transcript;
    const box = $('#voiceRaw');
    if (box) box.value = text;
  };
  recognition.onerror = (ev) => {
    if (ev.error === 'not-allowed') toast('Microphone permission denied', 'err');
    else if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Voice error: ' + ev.error, 'warn');
    stopListening();
  };
  recognition.onend = () => stopListening();
}

function startListening() {
  if (!recognition) {
    toast('Bengali voice not supported in this browser — please type the Bengali text below', 'warn');
    return;
  }
  try {
    recognition.start();
    listening = true;
    $('#voicePanel').classList.add('listening');
    $('#micBtn').textContent = '⏹';
    toast('Listening… speak in Bengali', 'ok');
  } catch (err) { /* already started */ }
}
function stopListening() {
  listening = false;
  const panel = $('#voicePanel');
  if (panel) panel.classList.remove('listening');
  const btn = $('#micBtn');
  if (btn) btn.textContent = '🎤';
  try { recognition && recognition.stop(); } catch (e) {}
}

document.addEventListener('click', e => {
  if (e.target.closest('#micBtn')) {
    if (listening) stopListening(); else startListening();
  }
});

/* ================================================================
   26. INIT
   ================================================================ */
function seedMedList() {
  $('#medList').innerHTML = MEDS.map(m => `<option value="${esc(m)}"></option>`).join('');
}

function init() {
  loadDB();
  seedMedList();
  initVoice();

  $('#loginForm').addEventListener('submit', doLogin);
  $('#togglePw').addEventListener('click', () => {
    const f = $('#lpass');
    f.type = f.type === 'password' ? 'text' : 'password';
  });

  $('#backupText').textContent = 'Backup: ' +
    (localStorage.getItem('arogya_last_backup') ? fmtDate(localStorage.getItem('arogya_last_backup')) : 'never');

  const last = localStorage.getItem('arogya_last_backup');
  if (!last || last !== todayISO()) {
    setTimeout(() => {
      if (!$('#app').classList.contains('hidden')) {
        toast('Tip: download a backup from Settings to keep your records safe', 'warn');
      }
    }, 9000);
  }
}

init();
</script>
