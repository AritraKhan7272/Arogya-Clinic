<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
<title>Arogya Clinic — Dr. U.K. Gorai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
:root{
  --bg:#f2f6fb; --card:#fff; --ink:#0f172a; --muted:#6b7a90; --line:#e6edf6;
  --brand:#0e9f8e; --brand-d:#0b7d70; --brand-l:#e6f7f5;
  --blue:#2f7cf6; --blue-l:#eaf2ff;
  --violet:#7c5cf0; --violet-l:#f1ecff;
  --amber:#f5a524; --amber-l:#fff5e3;
  --red:#ef4444; --red-l:#feecec;
  --green:#16a34a; --green-l:#e8f8ee;
  --r:16px; --r-sm:11px;
  --sh:0 2px 10px rgba(16,38,73,.06), 0 10px 30px rgba(16,38,73,.05);
  --sh-lg:0 18px 50px rgba(16,38,73,.16);
}
body{
  margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.5;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none !important}

/* ============================================================
   2. LOGIN
   ============================================================ */
.login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 500px at 12% -10%, #d9f4f0 0%, transparent 60%),
    radial-gradient(800px 500px at 100% 0%, #e2ecff 0%, transparent 55%),
    linear-gradient(160deg,#f7fbff,#eef4fb);
}
.login-card{
  width:100%;max-width:410px;background:#fff;border-radius:24px;padding:36px 32px 28px;
  box-shadow:var(--sh-lg);border:1px solid rgba(255,255,255,.8);text-align:center;
  animation:pop .45s cubic-bezier(.2,.8,.3,1);
}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.brand-badge{
  width:74px;height:74px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;
  font-size:34px;background:linear-gradient(135deg,#12b3a0,#0b8f80);
  box-shadow:0 12px 28px rgba(14,159,142,.32);
}
.login-card h1{font-size:22px;letter-spacing:2.5px;font-weight:800;color:#0d2b3e}
.login-card .tag{font-size:12.5px;color:var(--brand-d);font-weight:600;margin-top:6px;font-style:italic}
.login-card .doc{margin-top:14px;font-weight:700;font-size:15px;color:#1c3a52}
.login-card .doc small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.4px}
.login form{margin-top:24px;text-align:left;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:#43536b;margin-bottom:6px;letter-spacing:.2px}
.field input,.field select,.field textarea{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fbfdff;
  outline:none;transition:.16s;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(14,159,142,.11)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:16px;padding:6px;opacity:.6}
.pw button:hover{opacity:1}
.row-check{display:flex;align-items:center;gap:9px;font-size:13px;color:#43536b}
.row-check input{width:16px;height:16px;accent-color:var(--brand)}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
.hint b{color:#25324a}
.login-err{background:var(--red-l);color:#b91c1c;font-size:13px;padding:10px 12px;border-radius:10px;font-weight:600}

/* ============================================================
   3. BUTTONS / CHIPS / BADGES
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;
  padding:11px 16px;font-weight:600;font-size:14px;cursor:pointer;transition:.16s;
  background:#eef3f9;color:#25324a;white-space:nowrap;line-height:1;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.02)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.primary{background:linear-gradient(135deg,#12b3a0,#0b8f80);color:#fff;box-shadow:0 8px 20px rgba(14,159,142,.28)}
.btn.blue{background:linear-gradient(135deg,#3d8bfd,#2f6fe0);color:#fff;box-shadow:0 8px 20px rgba(47,124,246,.25)}
.btn.violet{background:linear-gradient(135deg,#8b6cf5,#6f4ce8);color:#fff;box-shadow:0 8px 20px rgba(124,92,240,.25)}
.btn.amber{background:linear-gradient(135deg,#f7b23c,#e79a10);color:#fff;box-shadow:0 8px 20px rgba(245,165,36,.28)}
.btn.danger{background:var(--red-l);color:#c62828}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:#33455e}
.btn.ghost:hover{border-color:#c9d8e8}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.lg{padding:15px 22px;font-size:15.5px;border-radius:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none !important}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:0;background:#f3f7fc;display:grid;place-items:center;
  cursor:pointer;font-size:16px;color:#33455e;transition:.16s;flex:0 0 auto;
}
.icon-btn:hover{background:#e8eff8;transform:translateY(-1px)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:#f3f7fc;
  border:1.5px solid transparent;font-size:13px;font-weight:600;color:#3a4a63;cursor:pointer;transition:.15s;
}
.chip:hover{background:#e9f1fa;transform:translateY(-1px)}
.chip.on{background:var(--brand-l);color:var(--brand-d);border-color:#a9e5dd}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;letter-spacing:.2px;
}
.badge.green{background:var(--green-l);color:#15803d}
.badge.red{background:var(--red-l);color:#b91c1c}
.badge.amber{background:var(--amber-l);color:#a16207}
.badge.blue{background:var(--blue-l);color:#1d4ed8}
.badge.violet{background:var(--violet-l);color:#5b3fd1}
.badge.gray{background:#eef2f7;color:#556}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ============================================================
   4. APP SHELL
   ============================================================ */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{
  background:#fff;border-right:1px solid var(--line);padding:18px 14px;
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px;z-index:60;
}
.side-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side-brand .logo{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,#12b3a0,#0b8f80);box-shadow:0 6px 16px rgba(14,159,142,.3);
}
.side-brand b{display:block;font-size:13.5px;letter-spacing:1.1px;font-weight:800;color:#0d2b3e}
.side-brand small{font-size:11px;color:var(--muted);letter-spacing:.3px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10.5px 12px;border-radius:12px;cursor:pointer;
  font-size:14px;font-weight:600;color:#4a5b73;transition:.15s;border:0;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:#f4f8fc;color:#1e2f45}
.nav-item.active{background:linear-gradient(135deg,#e8f8f6,#eef6ff);color:var(--brand-d);box-shadow:inset 0 0 0 1.5px #cbeee8}
.nav-item .ico{font-size:17px;width:22px;text-align:center}
.nav-sep{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#9aa9bd;padding:14px 12px 6px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.backup-pill{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#4b7a63;background:#eefaf2;padding:9px 11px;border-radius:11px;font-weight:600}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;
}
.hamburger{display:none}
.greet{min-width:0}
.greet h2{font-size:16px;font-weight:700;color:#12293d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.greet p{font-size:11.5px;color:var(--muted);margin-top:1px}
.search-wrap{flex:1;max-width:520px;position:relative;margin-left:auto}
.search-wrap input{
  width:100%;padding:11px 16px 11px 40px;border-radius:13px;border:1.5px solid var(--line);background:#f7fafd;
  outline:none;transition:.16s;font-size:14px;
}
.search-wrap input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(14,159,142,.1)}
.search-wrap .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;font-size:15px}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:15px;box-shadow:var(--sh-lg);
  border:1px solid var(--line);max-height:380px;overflow:auto;z-index:80;padding:7px;
}
.sr-item{display:flex;gap:11px;align-items:center;padding:10px 11px;border-radius:11px;cursor:pointer;transition:.13s}
.sr-item:hover{background:#f4f9fd}
.sr-avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--brand-l);color:var(--brand-d);flex:0 0 auto}
.sr-item b{font-size:13.5px;display:block}
.sr-item small{font-size:11.5px;color:var(--muted)}
.content{padding:22px;flex:1;min-width:0}
.bottom-nav{display:none}

/* ============================================================
   5. CARDS & GRIDS
   ============================================================ */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(230,237,246,.9);padding:20px}
.card.pad0{padding:0;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-head h3{font-size:15.5px;font-weight:700;color:#12293d;display:flex;align-items:center;gap:8px}
.card-head .sub{font-size:12px;color:var(--muted);font-weight:500}
.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.stat{
  background:#fff;border-radius:var(--r);padding:17px 18px;box-shadow:var(--sh);
  border:1px solid rgba(230,237,246,.9);display:flex;gap:14px;align-items:center;transition:.18s;cursor:pointer;
  position:relative;overflow:hidden;
}
.stat:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(16,38,73,.11)}
.stat .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.stat .v{font-size:22px;font-weight:800;color:#0f2b40;line-height:1.15;letter-spacing:-.4px}
.stat .l{font-size:11.8px;color:var(--muted);font-weight:600;margin-top:2px}
.i-teal{background:var(--brand-l);color:var(--brand-d)}
.i-blue{background:var(--blue-l);color:#1d4ed8}
.i-violet{background:var(--violet-l);color:#5b3fd1}
.i-amber{background:var(--amber-l);color:#a16207}
.i-red{background:var(--red-l);color:#b91c1c}
.i-green{background:var(--green-l);color:#15803d}

.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.quick-btn{
  border:0;border-radius:15px;padding:17px 15px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  cursor:pointer;font-weight:700;font-size:13.5px;transition:.18s;text-align:left;color:#fff;
}
.quick-btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(16,38,73,.16)}
.quick-btn .e{font-size:21px}
.q-green{background:linear-gradient(135deg,#17b899,#0e9b83)}
.q-blue{background:linear-gradient(135deg,#4b93ff,#2f6fe0)}
.q-violet{background:linear-gradient(135deg,#8f72f7,#6f4ce8)}
.q-amber{background:linear-gradient(135deg,#f9b944,#e79a10)}
.q-pink{background:linear-gradient(135deg,#f472a0,#e0507f)}

.list-row{
  display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:13px;transition:.14s;
  border:1px solid transparent;cursor:pointer;
}
.list-row:hover{background:#f7fafd;border-color:var(--line)}
.list-row + .list-row{margin-top:4px}
.avatar{
  width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:15px;
  background:linear-gradient(135deg,#e8f8f6,#eaf2ff);color:var(--brand-d);flex:0 0 auto;
}
.list-row .meta{flex:1;min-width:0}
.list-row .meta b{font-size:14px;display:block;color:#12293d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .meta small{font-size:12px;color:var(--muted);display:block;margin-top:1px}
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:13.5px}
.empty .e{font-size:32px;display:block;margin-bottom:10px;opacity:.55}

/* ============================================================
   6. TABLES / FORMS
   ============================================================ */
.table-wrap{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff;min-width:560px}
th{
  text-align:left;padding:12px 14px;background:#f8fbfe;font-size:11.5px;letter-spacing:.6px;
  text-transform:uppercase;color:#7d8ca0;font-weight:800;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid #f1f6fb;color:#2c3e55;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfe}
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
.field label{display:block;font-size:12px;font-weight:700;color:#4a5b73;margin-bottom:6px;letter-spacing:.2px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fbfdff;
  outline:none;transition:.16s;color:var(--ink);font-size:14px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(14,159,142,.1)}
.field textarea{resize:vertical;min-height:78px;line-height:1.55}
.section-title{font-size:12px;font-weight:800;letter-spacing:1px;color:#8b9aae;text-transform:uppercase;margin-bottom:10px}

/* ============================================================
   7. MODAL / TOAST
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,32,52,.42);backdrop-filter:blur(3px);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;transition:.2s;
}
.modal-backdrop.show{opacity:1}
.modal{
  background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;
  box-shadow:var(--sh-lg);transform:translateY(14px) scale(.98);transition:.22s;overflow:hidden;
}
.modal-backdrop.show .modal{transform:none}
.modal.wide{max-width:820px}
.modal.xwide{max-width:1040px}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font-size:16px;font-weight:700;color:#12293d}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#fbfdff;flex-wrap:wrap}

.toast-wrap{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  background:#12293d;color:#fff;padding:13px 17px;border-radius:13px;font-size:13.5px;font-weight:600;
  box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;animation:slideIn .28s cubic-bezier(.2,.8,.3,1);
  max-width:340px;
}
.toast.ok{background:linear-gradient(135deg,#12b3a0,#0b8f80)}
.toast.err{background:linear-gradient(135deg,#ef4444,#c62828)}
.toast.warn{background:linear-gradient(135deg,#f5a524,#d98a08)}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* ============================================================
   8. VOICE PANEL
   ============================================================ */
.voice-panel{
  background:linear-gradient(150deg,#f0fbf9,#eef5ff);border:1.5px dashed #a9e5dd;border-radius:18px;padding:20px;
  text-align:center;
}
.voice-panel.listening{border-color:var(--red);background:linear-gradient(150deg,#fff2f2,#fdf5f5);animation:pulseB 1.4s infinite}
@keyframes pulseB{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.18)}50%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.mic-btn{
  width:88px;height:88px;border-radius:50%;border:0;cursor:pointer;font-size:36px;color:#fff;
  background:linear-gradient(135deg,#12b3a0,#0b8f80);box-shadow:0 14px 34px rgba(14,159,142,.36);
  transition:.2s;margin:6px auto 12px;display:grid;place-items:center;
}
.mic-btn:hover{transform:scale(1.05)}
.mic-btn:active{transform:scale(.97)}
.voice-panel.listening .mic-btn{background:linear-gradient(135deg,#f45b5b,#d63030);box-shadow:0 14px 34px rgba(239,68,68,.4)}
.voice-hint{font-size:12.5px;color:#4a6b7a;font-weight:600}
.voice-out{
  margin-top:14px;background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px;
  text-align:left;font-size:13.5px;color:#2c3e55;min-height:56px;line-height:1.6;
}
.ai-note{
  display:flex;gap:8px;align-items:center;font-size:11.5px;color:#a16207;background:var(--amber-l);
  padding:8px 12px;border-radius:10px;font-weight:700;margin-top:12px;
}

/* ============================================================
   9. CONSULTATION LAYOUT
   ============================================================ */
.consult-grid{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.consult-header{
  background:linear-gradient(135deg,#0e9f8e,#0b7d70);border-radius:18px;padding:20px 22px;color:#fff;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 14px 34px rgba(14,159,142,.28);
}
.consult-header .avatar{background:rgba(255,255,255,.2);color:#fff;width:54px;height:54px;border-radius:16px;font-size:19px}
.consult-header h2{font-size:19px;font-weight:800}
.consult-header p{font-size:12.5px;opacity:.9;margin-top:2px}
.med-row{display:grid;grid-template-columns:2fr 1fr 1.1fr 1fr 1.4fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.med-row input,.med-row select{padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fbfdff;font-size:13px;outline:none;width:100%}
.med-row input:focus,.med-row select:focus{border-color:var(--brand);background:#fff}
.vital-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:10px}
.vital-box{background:#f8fbfe;border:1.5px solid var(--line);border-radius:13px;padding:11px 12px}
.vital-box label{font-size:10.5px;font-weight:800;letter-spacing:.5px;color:#8b9aae;text-transform:uppercase}
.vital-box input{border:0;background:transparent;width:100%;font-size:16px;font-weight:700;color:#12293d;outline:none;padding:2px 0 0}
.prev-strip{display:flex;gap:9px;flex-wrap:wrap}
.prev-pill{background:#f3f7fc;border-radius:10px;padding:7px 12px;font-size:12.5px;color:#43536b;font-weight:600}
.prev-pill b{color:#12293d}

/* ============================================================
   10. QUEUE
   ============================================================ */
.queue-hero{
  background:linear-gradient(135deg,#0e9f8e,#0b7d70);border-radius:20px;padding:26px;color:#fff;text-align:center;
  box-shadow:0 16px 40px rgba(14,159,142,.3);
}
.queue-hero .tk{font-size:12px;letter-spacing:2.5px;font-weight:800;opacity:.85}
.queue-hero .num{font-size:56px;font-weight:800;line-height:1;margin:6px 0 4px;letter-spacing:-2px}
.queue-hero .nm{font-size:17px;font-weight:700}
.queue-item{

const BN_DIGITS = '০১২৩৪৫৬৭৮৯';
const NUM_WORDS = { 'শূন্য':0,'এক':1,'দুই':2,'দুইটা':2,'তিন':3,'চার':4,'পাঁচ':5,'ছয়':6,'সাত':7,'আট':8,'নয়':9,'দশ':10,
  'এগারো':11,'বারো':12,'তেরো':13,'চোদ্দ':14,'পনেরো':15,'ষোলো':16,'সতেরো':17,'আঠারো':18,'উনিশ':19,'বিশ':20,
  'পঁচিশ':25,'তিরিশ':30,'পঁয়ত্রিশ':35,'চল্লিশ':40,'পঁয়তাল্লিশ':45,'পঞ্চাশ':50,'ষাট':60,'সত্তর':70,'আশি':80,
  'নব্বই':90,'একশো':100,'একশ':100,'দুইশো':200,'তিনশো':300 };

function normalizeBN(str) {
  let s = String(str || '').replace(/[০-৯]/g, d => BN_DIGITS.indexOf(d));
  const parts = s.split(/\s+/);
  const out = []; let acc = 0, has = false;
  for (const p of parts) {
    const clean = p.replace(/[।,.!?;:"']/g, '');
    if (NUM_WORDS[clean] !== undefined) { acc += NUM_WORDS[clean]; has = true; }
    else {
      if (has) { out.push(String(acc)); acc = 0; has = false; }
      out.push(p);
    }
  }
  if (has) out.push(String(acc));
  return out.join(' ').replace(/\s+/g, ' ').trim();
}

const SYMPTOM_MAP = [
  ['মাথা ব্যথা','headache'],['মাথাব্যথা','headache'],['গলা ব্যথা','sore throat'],['গলাব্যথা','sore throat'],

  ['শ্বাসকষ্ট','shortness of breath'],['বুক জ্বালা','heartburn'],['প্রস্রাবে জ্বালা','burning micturition'],
  ['মাথা ঘোরা','dizziness'],['পাতলা পায়খানা','loose stools'],['খিদে কম','loss of appetite'],
  ['ঘুম না হওয়া','insomnia'],['জ্বর','fever'],['কাশি','cough'],['ঠান্ডা','cold'],['সর্দি','running nose'],

];
const MOD_MAP = [['হালকা','mild'],['সামান্য','slight'],['মাঝারি','moderate'],['তীব্র','severe'],['অনেক','severe'],['বেশি','severe'],['কম','mild']];

function extractDuration(t) {
  let m = t.match(/(\d+)\s*দিন/); if (m) return m[1] + ' days';
  m = t.match(/(\d+)\s*সপ্তাহ/); if (m) return (m[1] * 7) + ' days';
  m = t.match(/(\d+)\s*মাস/); if (m) return m[1] + ' month(s)';
  m = t.match(/(\d+)\s*বছর/); if (m) return m[1] + ' year(s)';
  m = t.match(/(\d+)\s*ঘণ্টা/); if (m) return m[1] + ' hours';
  return '';
}

function extractSymptoms(t) {
  const found = [];
  for (const [bn, en] of SYMPTOM_MAP) {
    let idx = t.indexOf(bn);
    while (idx !== -1) {
      const before = t.slice(Math.max(0, idx - 12), idx);
      let mod = '';
      for (const [mb, me] of MOD_MAP) if (before.includes(mb)) { mod = me + ' '; break; }
      const phrase = mod + en;
      if (!found.includes(phrase)) found.push(phrase);
      idx = t.indexOf(bn, idx + 1);
      break;
    }
  }
  return found;
}

function parseVitalsBN(raw) {
  const t = normalizeBN(raw); const v = {}; let m;
  if ((m = t.match(/(?:প্রেসার|রক্তচাপ|বিপি|pressure|bp)[^\d]{0,12}(\d{2,3})\s*(?:বাই|by|\/)\s*(\d{2,3})/i))) v.bp = m[1] + '/' + m[2];
  else if ((m = t.match(/(\d{2,3})\s*(?:বাই|by|\/)\s*(\d{2,3})/))) v.bp = m[1] + '/' + m[2];
  if ((m = t.match(/(?:পালস|নাড়ি|pulse)[^\d]{0,12}(\d{2,3})/i))) v.pulse = m[1];
  if ((m = t.match(/(?:তাপমাত্রা|টেম্প|temperature|temp)[^\d]{0,12}(\d{2,3}(?:\.\d)?)/i))) v.temp = m[1];
  if ((m = t.match(/(?:অক্সিজেন|spo2|স্পো|স্যাচুরেশন|oxygen)[^\d]{0,12}(\d{2,3})/i))) v.spo2 = m[1];
  if ((m = t.match(/(?:ওজন|weight)[^\d]{0,12}(\d{2,3}(?:\.\d)?)/i))) v.weight = m[1];
  if ((m = t.match(/(?:উচ্চতা|height)[^\d]{0,12}(\d{2,3})/i))) v.height = m[1];
  if ((m = t.match(/(?:সুগার|শর্করা|blood sugar|sugar)[^\d]{0,12}(\d{2,3})/i))) v.sugar = m[1];
  if ((m = t.match(/(?:শ্বাস|respiratory|rr)[^\d]{0,12}(\d{1,2})/i))) v.rr = m[1];
  return v;
}

function parseFollowupBN(raw) {
  const t = normalizeBN(raw); let m;
  if ((m = t.match(/(\d+)\s*দিন(?:\s*পরে)?/))) return m[1] + ' days';
  if ((m = t.match(/(\d+)\s*সপ্তাহ/))) return (m[1] * 7) + ' days';
  if ((m = t.match(/(\d+)\s*মাস/))) return m[1] + ' month(s)';
  if (/কাল\b/.test(t)) return 'Tomorrow';
  if (/আগামীকাল/.test(t)) return 'Tomorrow';
  if (/এক সপ্তাহ/.test(t)) return '7 days';
  return '';
}

const WORD_MAP = [
  ['রোগীর','The patient'],['রোগী','Patient'],['ধরে','for'],['পরে','after'],['আবার','again'],['দেখাবেন','review'],
  ['খেতে','to eat'],['বলেছেন','reports'],['হয়েছে','has had'],['রয়েছে','present'],['আছে','present'],
  ['এবং','and'],['সাথে','with'],['ছাড়া','without'],['নেই','absent'],['বেশি','more'],['কম','less'],
  ['ভালো','better'],['খারাপ','worse'],['ব্যথা','pain'],['ওষুধ','medicine'],['খাওয়ার','meal'],['পরে','after']
];

function bnToEnglish(raw) {
  const t = normalizeBN(raw);
  if (!t) return '';
  const duration = extractDuration(t);
  const symptoms = extractSymptoms(t);
  let sentence = '';
  if (symptoms.length) {
    const list = symptoms.length === 1 ? symptoms[0]
      : symptoms.slice(0, -1).join(', ') + ' and ' + symptoms[symptoms.length - 1];
    sentence = 'Patient has had ' + list + (duration ? ' for ' + duration : '') + '.';
  } else if (duration) {
    sentence = 'Complaints present for ' + duration + '.';
  }

  const extras = [];
  if (/বিশ্রাম|আরাম/.test(t)) extras.push('Advised rest.');
  if (/পানি|জল/.test(t)) extras.push('Advised adequate oral fluids.');
  if (/গরম|উষ্ণ/.test(t)) extras.push('Advised warm fluids / gargle.');
  if (/ধূমপান/.test(t)) extras.push('Advised to stop smoking.');
  if (/নুন|লবণ/.test(t)) extras.push('Advised low-salt diet.');
  if (/ব্যায়াম|হাঁট/.test(t)) extras.push('Advised regular walking / exercise.');
  if (/টেস্ট|পরীক্ষা/.test(t)) extras.push('Investigations advised.');

  if (!sentence) {
    let out = t;
    for (const [bn, en] of WORD_MAP) out = out.split(bn).join(' ' + en + ' ');
    out = out.replace(/\s+/g, ' ').trim();
    if (/[\u0980-\u09FF]/.test(out)) {
      sentence = 'Clinical note recorded (Bengali): "' + raw.trim() + '"';
    } else {
      sentence = out.charAt(0).toUpperCase() + out.slice(1);
      if (!/[.!?]$/.test(sentence)) sentence += '.';
    }
  }
  if (extras.length) sentence += ' ' + extras.join(' ');
  return sentence.trim();
}

        <h3>🎟 Live Queue</h3>
        <button class="btn ghost sm" data-page="queue">Open queue →</button>
      </div>

          <div class="tk">NOW SERVING · TOKEN</div>

          <div class="nm">${esc(patientName(cur.patientId))}</div>

        <button class="btn ghost sm" data-page="followups">Manage →</button></div>

        <div class="list-row">
          <div class="avatar">${initials(patientName(f.patientId))}</div>
          <div class="meta"><b>${esc(patientName(f.patientId))}</b>
            <small>${fmtDateShort(f.date)} · ${f.time || ''} ${f.note ? '· ' + esc(f.note) : ''}</small></div>
          <button class="btn sm ghost" data-action="open-patient" data-id="${f.patientId}">Open</button>
        </div>`).join('') : `<div class="empty"><span class="e">✅</span>Nothing pending</div>`}
    </div>

    <div class="card">
      <div class="card-head"><h3>📦 Stock &amp; Alerts</h3>
        <button class="btn ghost sm" data-page="inventory">Inventory →</button></div>
      ${expiredStock().slice(0,2).map(i => `<div class="alert-row red" style="margin-bottom:7px">🔴 Expired — ${esc(i.name)} (batch ${esc(i.batch)})</div>`).join('')}
      ${expiringSoon().slice(0,2).map(i => `<div class="alert-row amber" style="margin-bottom:7px">🟠 Expiring soon — ${esc(i.name)} · ${fmtDate(i.expiry)}</div>`).join('')}
      ${lowStock().slice(0,3).map(i => `<div class="alert-row blue" style="margin-bottom:7px">🟡 Low stock — ${esc(i.name)} · ${i.qty} ${esc(i.unit)} left</div>`).join('')}
      ${(!expiredStock().length && !expiringSoon().length && !lowStock().length) ? `<div class="empty"><span class="e">✅</span>All stock levels healthy</div>` : ''}

  <div class="card" style="margin-top:18px">
    <div class="card-head"><h3>🕘 Recent Consultations</h3>
      <button class="btn ghost sm" data-page="prescriptions">Prescriptions →</button></div>

      <div class="list-row" data-action="open-patient" data-id="${c.patientId}">

          <small>${fmtDate(c.date)} · ${esc(c.diagnosis || 'No diagnosis recorded')}</small></div>
        <span class="badge gray">${(c.meds || []).length} med</span>

  </div>`;
}

let patientFilter = '';

  const q = patientFilter.toLowerCase().trim();
  const list = DB.patients.filter(p =>
    !q || p.name.toLowerCase().includes(q) || p.mobile.includes(q) || p.id.toLowerCase().includes(q));

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-head" style="margin-bottom:12px">
      <h3>👤 Patients <span class="badge gray">${DB.patients.length}</span></h3>
      <button class="btn primary" data-action="new-patient">➕ New Patient</button>
    </div>
    <input id="patientSearch" placeholder="🔍 Filter by name, mobile or Patient ID…" value="${esc(patientFilter)}"
      style="width:100%;padding:12px 15px;border:1.5px solid var(--line);border-radius:12px;outline:none;background:#fbfdff;font-size:14px" />
  </div>

  <div class="card pad0">
    ${list.length ? `<div class="table-wrap" style="border:0">
      <table>
        <thead><tr><th>Patient</th><th>ID</th><th>Age / Gender</th><th>Mobile</th><th>Last Visit</th><th></th></tr></thead>
        <tbody>
        ${list.map(p => {
          const cs = patientConsults(p.id);

              <div class="avatar" style="width:36px;height:36px;font-size:13px">${initials(p.name)}</div>
              <div><b>${esc(p.name)}</b>${p.allergies && p.allergies !== 'None known' && p.allergies !== 'None'
                ? `<div style="font-size:11px;color:#b91c1c;font-weight:700">⚠ ${esc(p.allergies)}</div>` : ''}</div>
            </div></td>
            <td><span class="badge gray">${esc(p.id)}</span></td>
            <td>${esc(p.age || '—')} · ${esc(p.gender || '—')}</td>
            <td>${esc(p.mobile)}</td>
            <td>${last}</td>
            <td style="text-align:right;white-space:nowrap">
              <button class="btn sm ghost" data-action="open-patient" data-id="${p.id}">Open →</button>
            </td>
          </tr>`;
        }).join('')}
        </tbody>
      </table></div>`
    : `<div class="empty"><span class="e">👤</span>No patients found.<br><button class="btn primary" style="margin-top:14px" data-action="new-patient">➕ Register first patient</button></div>`}
  </div>`;
}

/* ---------- Patient Profile ---------- */
let profileTab = 'overview';

function renderPatientProfile(id) {
  const p = P(id);
  if (!p) return `<div class="empty">Patient not found</div>`;
  const cons = patientConsults(id);
  const bills = patientBills(id);
  const reps = patientReports(id);
  const tabs = ['overview','visits','history','prescriptions','reports','bills','trends'];
  const tabLabel = { overview:'Overview', visits:'Visits', history:'Medical History', prescriptions:'Prescriptions',
    reports:'Reports', bills:'Bills', trends:'Health Trends' };

  return `
  <button class="btn ghost sm" style="margin-bottom:14px" data-page="patients">← All patients</button>

  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap">
      <div class="avatar" style="width:70px;height:70px;border-radius:20px;font-size:24px">${initials(p.name)}</div>
      <div style="flex:1;min-width:220px">
        <h2 style="font-size:22px;font-weight:800;color:#0d2b3e">${esc(p.name)}</h2>
        <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:7px;align-items:center">
          <span class="badge blue">${esc(p.id)}</span>
          <span class="badge gray">${esc(p.age || '—')} yrs · ${esc(p.gender || '—')}</span>
          ${p.blood ? `<span class="badge red">🩸 ${esc(p.blood)}</span>` : ''}
          <span class="badge gray">📞 ${esc(p.mobile)}</span>
        </div>
        ${p.allergies && p.allergies !== 'None known' && p.allergies !== 'None'
          ? `<div class="alert-row red" style="margin-top:11px">⚠️ <b>Allergies:</b> ${esc(p.allergies)}</div>` : ''}
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn primary" data-action="start-consult" data-id="${p.id}">🩺 Consultation</button>
        <button class="btn violet" data-action="quick-rx" data-id="${p.id}">💊 Prescription</button>
        <button class="btn amber" data-action="new-bill" data-id="${p.id}">💰 Bill</button>
        <button class="btn ghost" data-action="edit-patient" data-id="${p.id}">✎ Edit</button>
      </div>
    </div>
  </div>

  <div class="card pad0">
    <div class="tabs" style="padding:0 12px">
      ${tabs.map(t => `<button class="tab ${profileTab === t ? 'on' : ''}" data-action="profile-tab" data-tab="${t}">${tabLabel[t]}</button>`).join('')}
    </div>
    <div style="padding:20px">${profileTabContent(p, cons, bills, reps)}</div>
  </div>`;
}

function profileTabContent(p, cons, bills, reps) {
  switch (profileTab) {
    case 'overview': {
      const last = cons[0];
      return `
      <div class="grid g-3" style="margin-bottom:18px">
        <div class="stat" style="cursor:default"><div class="ico i-teal">🩺</div><div><div class="v">${cons.length}</div><div class="l">Total Visits</div></div></div>
        <div class="stat" style="cursor:default"><div class="ico i-blue">📅</div><div><div class="v">${last ? fmtDateShort(last.date) : '—'}</div><div class="l">Last Visit</div></div></div>
        <div class="stat" style="cursor:default"><div class="ico i-green">💰</div><div><div class="v">${money(bills.reduce((s,b)=>s+Number(b.paid||0),0))}</div><div class="l">Total Paid</div></div></div>
      </div>
      <div class="grid g-2">
        <div>
          <div class="section-title">Important Information</div>
          <div class="alert-row red" style="margin-bottom:8px">❤️ <b>Allergies:</b>&nbsp;${esc(p.allergies || 'None known')}</div>
          <div class="alert-row amber" style="margin-bottom:8px">🩺 <b>Conditions:</b>&nbsp;${esc(p.conditions || '—')}</div>
          <div class="alert-row blue" style="margin-bottom:8px">💊 <b>Medicines:</b>&nbsp;${esc(p.medicines || '—')}</div>
          <div class="alert-row blue">🧬 <b>Family history:</b>&nbsp;${esc(p.family || '—')}</div>
        </div>
        <div>
          <div class="section-title">Contact</div>
          <div style="font-size:13.5px;line-height:2;color:#3a4a63">
            <div>📞 <b>${esc(p.mobile)}</b></div>
            <div>🏠 ${esc(p.address || '—')}</div>
            <div>🚑 Emergency: ${esc(p.emergency || '—')}</div>
            <div>🆔 ABHA: ${esc(p.abha || '—')}</div>
            <div>🎂 DOB: ${p.dob ? fmtDate(p.dob) : '—'}</div>
          </div>
        </div>
      </div>
      ${p.notes ? `<div style="margin-top:18px"><div class="section-title">Notes</div>
        <div style="background:#f8fbfe;border-radius:12px;padding:13px;font-size:13.5px;color:#3a4a63">${esc(p.notes)}</div></div>` : ''}`;
    }
    case 'visits':
      return cons.length ? cons.map(c => `
        <div class="card" style="box-shadow:none;border:1.5px solid var(--line);margin-bottom:11px;padding:16px">
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
            <div><b style="font-size:14.5px;color:#12293d">${fmtDate(c.date)}</b>
              <span class="badge gray" style="margin-left:8px">Consultation</span></div>
            <button class="btn sm ghost" data-action="print-rx" data-id="${c.id}">🖨 Prescription</button>
          </div>
          <div style="margin-top:11px;font-size:13.5px;color:#3a4a63;line-height:1.8">
            <div><b>Diagnosis:</b> ${esc(c.diagnosis || '—')}</div>
            <div><b>Complaints:</b> ${esc((c.complaints || []).join(', ') || '—')}</div>
            <div><b>Medicines:</b> ${(c.meds || []).length ? c.meds.map(m => esc(m.name)).join(', ') : '—'}</div>
            ${c.followUp ? `<div><b>Follow-up:</b> ${esc(c.followUp)}</div>` : ''}
          </div>
        </div>`).join('') : `<div class="empty"><span class="e">🩺</span>No visits recorded yet</div>`;
    case 'history':
      return `<div class="grid g-2">
        <div><div class="section-title">Existing Conditions</div><div class="alert-row amber">🩺 ${esc(p.conditions || '—')}</div></div>
        <div><div class="section-title">Allergies</div><div class="alert-row red">❤️ ${esc(p.allergies || 'None known')}</div></div>
        <div><div class="section-title">Current Medicines</div><div class="alert-row blue">💊 ${esc(p.medicines || '—')}</div></div>
        <div><div class="section-title">Previous Surgeries</div><div class="alert-row blue">🏥 ${esc(p.surgeries || '—')}</div></div>
        <div><div class="section-title">Family History</div><div class="alert-row blue">🧬 ${esc(p.family || '—')}</div></div>
        <div><div class="section-title">Blood Group</div><div class="alert-row red">🩸 ${esc(p.blood || '—')}</div></div>
      </div>`;
    case 'prescriptions':
      return cons.filter(c => (c.meds || []).length).length
        ? cons.filter(c => (c.meds || []).length).map(c => `
          <div class="card" style="box-shadow:none;border:1.5px solid var(--line);margin-bottom:11px;padding:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
              <b style="color:#12293d">${fmtDate(c.date)} — ${esc(c.diagnosis || 'Prescription')}</b>
              <div style="display:flex;gap:7px">
                <button class="btn sm ghost" data-action="print-rx" data-id="${c.id}">🖨 Print</button>
                <button class="btn sm ghost" data-action="reuse-rx" data-id="${c.id}">↻ Reuse</button>
              </div>
            </div>
            <div style="margin-top:10px">
              ${c.meds.map(m => `<div style="font-size:13px;color:#3a4a63;padding:5px 0;border-bottom:1px dashed #eef2f7">
                <b>${esc(m.name)}</b> — ${esc(m.dose || '')} · ${esc(m.freq || '')} · ${esc(m.dur || '')} ${m.note ? '· ' + esc(m.note) : ''}</div>`).join('')}
            </div>
          </div>`).join('')
        : `<div class="empty"><span class="e">💊</span>No prescriptions yet</div>`;
    case 'reports':
      return reps.length ? reps.map(r => `
        <div class="list-row">
          <div class="avatar">🧪</div>
          <div class="meta"><b>${esc(r.type)}</b><small>${fmtDate(r.date)} · ${esc(r.name)}</small></div>
          <span class="badge ${r.status === 'Completed' ? 'green' : 'amber'}">${esc(r.status)}</span>
          ${r.data ? `<button class="btn sm ghost" data-action="open-report" data-id="${r.id}">Open</button>` : ''}
        </div>`).join('') : `<div class="empty"><span class="e">🧪</span>No reports attached</div>`;
    case 'bills':
      return bills.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Invoice</th><th>Date</th><th>Total</th><th>Paid</th><th>Status</th><th></th></tr></thead>
        <tbody>${bills.map(b => `<tr>
          <td><b>${esc(b.no)}</b></td><td>${fmtDate(b.date)}</td><td>${money(b.total)}</td><td>${money(b.paid)}</td>
          <td><span class="badge ${b.status === 'Paid' ? 'green' : 'amber'}">${esc(b.status)}</span></td>
          <td style="text-align:right"><button class="btn sm ghost" data-action="print-bill" data-id="${b.id}">🖨</button></td>
        </tr>`).join('')}</tbody></table></div>`
        : `<div class="empty"><span class="e">💰</span>No bills yet</div>`;
    case 'trends': {
      const withVitals = cons.slice().reverse().filter(c => c.vitals && (c.vitals.bp || c.vitals.weight));
      if (!withVitals.length) return `<div class="empty"><span class="e">📈</span>Not enough vitals data yet</div>`;
      const bps = withVitals.map(c => parseInt((c.vitals.bp || '').split('/')[0]) || 0).filter(Boolean);
      const ws = withVitals.map(c => parseFloat(c.vitals.weight) || 0).filter(Boolean);
      const maxBp = Math.max(...bps, 160), maxW = Math.max(...ws, 1);
      return `
      <div class="section-title">Blood Pressure (systolic)</div>
      <div class="trend">${bps.map((v,i) => `<div class="bar" style="height:${(v/maxBp)*100}%"><em>${v}</em><span>${i+1}</span></div>`).join('')}</div>
      <div style="height:26px"></div>
      <div class="section-title">Weight (kg)</div>
      <div class="trend">${ws.map((v,i) => `<div class="bar" style="height:${(v/maxW)*100}%;background:linear-gradient(180deg,#5b9bf8,#bcd7ff)"><em>${v}</em><span>${i+1}</span></div>`).join('')}</div>
      <div style="height:26px"></div>
      <div class="section-title">Visit Frequency</div>
      <div style="font-size:13.5px;color:#3a4a63">${cons.length} consultation(s) recorded · Last visit ${cons[0] ? fmtDate(cons[0].date) : '—'}</div>`;
    }
  }
  return '';
}

/* ================================================================
   9. CONSULTATION
   ================================================================ */
let C = null;

function newDraft(patientId) {
  return {
    patientId, complaints: [], symptoms: '', history: '', examination: '',
    vitals: {}, diagnosis: '', investigations: [], meds: [], advice: '', followUp: '', notes: '',
    voiceText: '', raw: ''
  };
}

function renderConsultation(patientId) {
  if (patientId && typeof patientId === 'string' && P(patientId)) {
    if (!C || C.patientId !== patientId) C = newDraft(patientId);
  }
  if (!C || !P(C.patientId)) {
    return `
    <div class="card">
      <div class="card-head"><h3>🩺 Start a Consultation</h3></div>
      <p style="font-size:13.5px;color:var(--muted);margin-bottom:16px">Select a patient from today's queue or search for any patient.</p>
      ${todayQueue().filter(q => q.status !== 'done').map(q => `
        <div class="list-row" data-action="start-consult" data-id="${q.patientId}">
          <div class="tkn" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:#f3f7fc">${q.token}</div>
          <div class="meta"><b>${esc(patientName(q.patientId))}</b><small>${esc(q.patientId)} · ${esc(q.status)}</small></div>
          <span class="badge blue">Start →</span>
        </div>`).join('')}
      <div style="margin-top:18px">
        <div class="section-title">Or choose any patient</div>
        ${DB.patients.slice(0, 6).map(p => `
          <div class="list-row" data-action="start-consult" data-id="${p.id}">
            <div class="avatar">${initials(p.name)}</div>
            <div class="meta"><b>${esc(p.name)}</b><small>${esc(p.id)} · ${esc(p.age)} yrs · ${esc(p.gender)}</small></div>
            <span class="badge gray">Select</span>
          </div>`).join('')}
      </div>
    </div>`;
  }

  const p = P(C.patientId);
  const prev = patientConsults(p.id)[0];
  const pv = prev ? prev.vitals || {} : {};
  const V = C.vitals;

  return `
  <div class="consult-header" style="margin-bottom:16px">
    <div class="avatar">${initials(p.name)}</div>
    <div style="flex:1;min-width:180px">
      <h2>${esc(p.name)}</h2>
      <p>${esc(p.id)} · ${esc(p.age || '—')} years · ${esc(p.gender || '—')} ${p.blood ? '· ' + esc(p.blood) : ''}</p>
      ${p.allergies && p.allergies !== 'None known' && p.allergies !== 'None'
        ? `<p style="margin-top:6px;background:rgba(255,255,255,.22);display:inline-block;padding:3px 10px;border-radius:8px;font-weight:700">⚠ Allergy: ${esc(p.allergies)}</p>` : ''}
    </div>
    <button class="btn" style="background:rgba(255,255,255,.2);color:#fff" data-action="end-consult">✕ Close</button>
  </div>

  ${prev ? `<div class="card" style="margin-bottom:16px;padding:14px 18px">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <b style="font-size:12px;letter-spacing:.8px;color:#8b9aae;text-transform:uppercase">Previous visit · ${fmtDate(prev.date)}</b>
      <div class="prev-strip">
        ${pv.bp ? `<span class="prev-pill">BP <b>${esc(pv.bp)}</b></span>` : ''}
        ${pv.weight ? `<span class="prev-pill">Weight <b>${esc(pv.weight)} kg</b></span>` : ''}
        ${pv.pulse ? `<span class="prev-pill">Pulse <b>${esc(pv.pulse)}</b></span>` : ''}
        ${prev.diagnosis ? `<span class="prev-pill">Dx <b>${esc(prev.diagnosis)}</b></span>` : ''}
      </div>
    </div>
  </div>` : ''}

  <div class="consult-grid">
    <div style="display:flex;flex-direction:column;gap:16px">

      <div class="card">
        <div class="card-head"><h3>📝 Chief Complaint &amp; Symptoms</h3>
          <button class="btn ghost sm" data-action="rx-template">📚 Template</button></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px">
          ${SYMPTOM_CHIPS.map(s => `<button class="chip ${C.complaints.includes(s) ? 'on' : ''}" data-action="toggle-complaint" data-v="${s}">${s}</button>`).join('')}
        </div>
        <div class="field" style="margin-bottom:12px">
          <label>Complaints in detail</label>
          <textarea id="cSymptoms" placeholder="e.g. Fever for 3 days with mild cough">${esc(C.symptoms)}</textarea>
        </div>
        <div class="field">
          <label>History / Past illness</label>
          <textarea id="cHistory" placeholder="Relevant past history">${esc(C.history)}</textarea>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>🎤 Speak in Bengali → English</h3><span class="sub">Signature feature</span></div>

function vitalBox(key, label, val, prev) {

}

function medRow(m, i) {
  return `<div class="med-row" data-mi="${i}">

function syncDraftFromDOM() {
  if (!C) return;
  const g = id => { const el = $('#' + id); return el ? el.value : ''; };
  C.symptoms = g('cSymptoms');
  C.history = g('cHistory');
  C.examination = g('cExam');
  C.diagnosis = g('cDiagnosis');
  C.advice = g('cAdvice');
  C.followUp = g('cFollowUp');
  C.notes = g('cNotes');
  C.voiceText = g('cVoiceOut');
  C.raw = g('voiceRaw');

  const vit = {};
  $$('[data-vital]').forEach(el => { if (el.value.trim()) vit[el.dataset.vital] = el.value.trim(); });
  C.vitals = vit;

  const invs = $$('.inv-input').map(el => el.value.trim()).filter(Boolean);
  C.investigations = invs;

  C.meds = $$('#medListBody .med-row').map(r => ({
    name: r.querySelector('.m-name').value.trim(),
    dose: r.querySelector('.m-dose').value.trim(),
    freq: r.querySelector('.m-freq').value,
    dur: r.querySelector('.m-dur').value.trim(),
    note: r.querySelector('.m-note').value.trim()
  })).filter(m => m.name);
}

function renderQueue() {
  const q = todayQueue();
  const cur = q.find(x => x.status === 'current');

  const done = q.filter(x => x.status === 'done');

  return `
  <div class="grid g-2" style="margin-bottom:18px">
    <div class="card pad0" style="padding:22px">
      <div class="queue-hero">
        <div class="tk">NOW SERVING · TOKEN</div>
        <div class="num">${cur ? cur.token : '—'}</div>
        <div class="nm">${cur ? esc(patientName(cur.patientId)) : 'No patient in room'}</div>
        <div style="display:flex;gap:9px;justify-content:center;margin-top:18px;flex-wrap:wrap">
          <button class="btn lg" style="background:#fff;color:#0b7d70" data-action="call-next">▶ Call Next</button>
          ${cur ? `<button class="btn lg" style="background:rgba(255,255,255,.22);color:#fff" data-action="start-consult" data-id="${cur.patientId}">🩺 Start</button>
                   <button class="btn lg" style="background:rgba(255,255,255,.22);color:#fff" data-action="complete-token" data-id="${cur.id}">✓ Done</button>` : ''}
        </div>
      </div>
      <div style="margin-top:16px;display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn primary" data-action="add-token">🎟 Add Token</button>
        <button class="btn ghost" data-action="skip-token" ${cur ? '' : 'disabled'}>⏭ Skip Current</button>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h3>⏳ Waiting <span class="badge amber">${waiting.length}</span></h3></div>
      ${waiting.length ? waiting.map(x => `
        <div class="queue-item" style="margin-bottom:9px">
          <div class="tkn">${x.token}</div>
          <div style="flex:1;min-width:0">
            <b style="font-size:14px">${esc(patientName(x.patientId))}</b>
            <div style="font-size:11.5px;color:var(--muted)">${esc(x.patientId)}</div>
          </div>
          <button class="btn sm primary" data-action="call-token" data-id="${x.id}">Call</button>
        </div>`).join('') : `<div class="empty"><span class="e">🎟</span>No one waiting</div>`}
      ${done.length ? `<div class="section-title" style="margin-top:18px">Completed today (${done.length})</div>
        ${done.map(x => `<div class="list-row" style="opacity:.6">
          <div class="tkn" style="width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;background:#eef8f1;color:#15803d">${x.token}</div>
          <div class="meta"><b>${esc(patientName(x.patientId))}</b><small>Completed</small></div>
          <span class="badge green">✓</span></div>`).join('')}` : ''}
    </div>
  </div>`;
}

function callToken(qid) {
  const q = todayQueue();
  q.forEach(x => { if (x.status === 'current') x.status = 'waiting'; });
  const item = DB.queue.find(x => x.id === qid);
  if (item) { item.status = 'current'; saveDB(); toast('Token ' + item.token + ' called', 'ok'); }
  go('queue');
}
function callNext() {
  const nxt = todayQueue().filter(x => x.status === 'waiting').sort((a,b) => a.token - b.token)[0];
  if (!nxt) { toast('No patients waiting', 'warn'); return; }
  callToken(nxt.id);
}

let apptView = 'today';
function renderAppointments() {
  const t = todayISO();
  let list = DB.appointments.slice();
  if (apptView === 'today') list = list.filter(a => a.date === t);
  else if (apptView === 'week') { const end = shiftISO(7); list = list.filter(a => a.date >= t && a.date <= end); }
  else if (apptView === 'month') { const end = shiftISO(30); list = list.filter(a => a.date >= t && a.date <= end); }
  list.sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-head" style="margin-bottom:12px">
      <h3>📅 Appointments</h3>

      ${[['today','Today'],['week','This Week'],['month','This Month'],['all','All']].map(([k,l]) =>
        `<button class="pill ${apptView === k ? 'on' : ''}" data-action="appt-view" data-v="${k}">${l}</button>`).join('')}
    </div>
  </div>

  <div class="card pad0">
    ${list.length ? `<div class="table-wrap" style="border:0"><table>
      <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Type</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(a => `<tr>
        <td>${fmtDate(a.date)}</td>

        <td><div style="display:flex;align-items:center;gap:9px">
          <div class="avatar" style="width:32px;height:32px;font-size:12px">${initials(patientName(a.patientId))}</div>
          <div><b>${esc(patientName(a.patientId))}</b><div style="font-size:11px;color:var(--muted)">${esc(a.patientId)}</div></div>

        <td><span class="badge violet">${esc(a.type)}</span></td>

        </td>
      </tr>`).join('')}</tbody>
    </table></div>` : `<div class="empty"><span class="e">📅</span>No appointments in this period</div>`}

function renderInventory() {
  const items = DB.inventory.slice().sort((a,b) => a.name.localeCompare(b.name));
  const stockValue = items.reduce((s,i) => s + i.qty * i.sell, 0);
  return `
  <div class="grid g-4" style="margin-bottom:16px">
    <div class="stat" style="cursor:default"><div class="ico i-blue">📦</div><div><div class="v">${items.length}</div><div class="l">Products</div></div></div>
    <div class="stat" style="cursor:default"><div class="ico i-red">🔴</div><div><div class="v">${expiredStock().length}</div><div class="l">Expired</div></div></div>
    <div class="stat" style="cursor:default"><div class="ico i-amber">🟠</div><div><div class="v">${expiringSoon().length}</div><div class="l">Expiring ≤60d</div></div></div>
    <div class="stat" style="cursor:default"><div class="ico i-green">💵</div><div><div class="v">${money(stockValue)}</div><div class="l">Stock Value</div></div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h3>📦 Medicine Inventory</h3>
      <button class="btn primary" data-action="new-stock">➕ Add Stock Item</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Medicine</th><th>Batch</th><th>Expiry</th><th>Qty</th><th>Purchase</th><th>Sell</th><th>Status</th><th></th></tr></thead>
        <tbody>${items.map(i => {
          const dleft = (new Date(i.expiry) - new Date()) / 86400000;
          let st = `<span class="badge green">🟢 Normal</span>`;
          if (dleft < 0) st = `<span class="badge red">🔴 Expired</span>`;
          else if (dleft <= 60) st = `<span class="badge amber">🟠 Expiring</span>`;
          else if (i.qty <= i.reorder) st = `<span class="badge amber">🟡 Low stock</span>`;
          return `<tr>
            <td><b>${esc(i.name)}</b><div style="font-size:11px;color:var(--muted)">${esc(i.generic || '')} · ${esc(i.brand || '')}</div></td>
            <td>${esc(i.batch)}</td>
            <td>${fmtDate(i.expiry)}</td>
            <td><b>${i.qty}</b> ${esc(i.unit)}</td>
            <td>${money(i.purchase)}</td>
            <td>${money(i.sell)}</td>
            <td>${st}</td>
            <td style="text-align:right;white-space:nowrap">
              <button class="btn sm ghost" data-action="stock-add" data-id="${i.id}">+</button>
              <button class="btn sm ghost" data-action="stock-edit" data-id="${i.id}">✎</button>
              <button class="btn sm ghost" data-action="stock-del" data-id="${i.id}">🗑</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>⚠️ Reorder Reminders</h3></div>
    ${lowStock().length ? lowStock().map(i => `<div class="alert-row blue" style="margin-bottom:8px">
      🟡 <b>${esc(i.name)}</b> — only ${i.qty} ${esc(i.unit)} left (reorder level ${i.reorder}) · Supplier: ${esc(i.supplier || '—')}</div>`).join('')
      : `<div class="empty"><span class="e">✅</span>No reorder needed</div>`}
  </div>`;
}

/* ================================================================
   17. ANALYTICS
   ================================================================ */
function renderAnalytics() {
  const t = todayISO();
  const last7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = shiftISO(-i);
    last7.push({
      d,
      patients: DB.consultations.filter(c => c.date === d).length,
      revenue: DB.bills.filter(b => b.date === d).reduce((s,b) => s + Number(b.paid||0), 0)
    });
  }
  const maxP = Math.max(...last7.map(x => x.patients), 1);
  const maxR = Math.max(...last7.map(x => x.revenue), 1);

  const monthConsults = DB.consultations.filter(c => c.date >= shiftISO(-30));
  const monthBills = DB.bills.filter(b => b.date >= shiftISO(-30));
  const returning = new Set(monthConsults.map(c => c.patientId)).size;
  const newPts = DB.patients.filter(p => p.createdAt >= shiftISO(-30)).length;

  return `
  <div class="grid g-4" style="margin-bottom:18px">
    <div class="stat" style="cursor:default"><div class="ico i-teal">👥</div><div><div class="v">${DB.patients.length}</div><div class="l">Total Patients</div></div></div>
    <div class="stat" style="cursor:default"><div class="ico i-blue">🆕</div><div><div class="v">${newPts}</div><div class="l">New (30 days)</div></div></div>
    <div class="stat" style="cursor:default"><div class="ico i-violet">🩺</div><div><div class="v">${monthConsults.length}</div><div class="l">Consults (30 days)</div></div></div>
    <div class="stat" style="cursor:default"><div class="ico i-green">💰</div><div><div class="v">${money(monthBills.reduce((s,b)=>s+Number(b.paid||0),0))}</div><div class="l">Revenue (30 days)</div></div></div>
  </div>

  <div class="grid g-2">
    <div class="card">
      <div class="card-head"><h3>📊 Patients — Last 7 Days</h3></div>
      <div class="trend">
        ${last7.map(x => `<div class="bar" style="height:${(x.patients / maxP) * 100}%">
          <em>${x.patients}</em><span>${new Date(x.d + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'}).slice(0,3)}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>💵 Revenue — Last 7 Days</h3></div>
      <div class="trend">
        ${last7.map(x => `<div class="bar" style="height:${(x.revenue / maxR) * 100}%;background:linear-gradient(180deg,#5b9bf8,#bcd7ff)">
          <em>${x.revenue ? Math.round(x.revenue/100)*100 : 0}</em><span>${new Date(x.d + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'}).slice(0,3)}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>📈 Practice Summary (30 days)</h3></div>
      <div style="font-size:13.5px;color:#3a4a63;line-height:2.1">
        <div>Total consultations: <b>${monthConsults.length}</b></div>
        <div>Unique patients seen: <b>${returning}</b></div>
        <div>New registrations: <b>${newPts}</b></div>
        <div>Appointment completion: <b>${DB.appointments.length ? Math.round(DB.appointments.filter(a=>a.status==='Completed').length / DB.appointments.length * 100) : 0}%</b></div>
        <div>No-shows: <b>${DB.appointments.filter(a => a.status === 'No-show').length}</b></div>
        <div>Follow-ups completed: <b>${DB.followups.filter(f => f.done).length}</b></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>💳 Payment Methods (30 days)</h3></div>
      ${(() => {
        const by = {};
        monthBills.forEach(b => { by[b.method || 'Other'] = (by[b.method || 'Other'] || 0) + Number(b.paid||0); });
        const keys = Object.keys(by);
        if (!keys.length) return `<div class="empty"><span class="e">💳</span>No payments yet</div>`;
        const tot = keys.reduce((s,k) => s + by[k], 0);
        return keys.map(k => `
          <div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#3a4a63;margin-bottom:5px">
              <span>${esc(k)}</span><span>${money(by[k])}</span></div>
            <div style="height:9px;background:#eef3f9;border-radius:6px;overflow:hidden">
              <div style="height:100%;width:${(by[k]/tot)*100}%;background:linear-gradient(90deg,#12b3a0,#5fd6c6);border-radius:6px"></div>
            </div>
          </div>`).join('');
      })()}
    </div>
  </div>`;
}

function closeModal() { $$('.modal-backdrop').forEach(m => m.remove()); }

function openModal(title, body, footer, size = '') {
  closeModal();
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.innerHTML = `<div class="modal ${size}">
    <div class="modal-head"><h3>${title}</h3><button class="icon-btn" data-action="close-modal">✕</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${footer || '<button class="btn ghost" data-action="close-modal">Close</button>'}</div>
  </div>`;
  $('#modalRoot').appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  const first = el.querySelector('input,select,textarea');
  if (first && window.innerWidth > 880) setTimeout(() => first.focus(), 120);
  return el;
}

function renderBillItems() {
  const b = $('#billItemsBody');
  if (!b) return;
  b.innerHTML = billItems.map((it, i) => `
    <div class="med-row" style="grid-template-columns:2fr 1fr 40px">
      <input class="bi-desc" value="${esc(it.desc)}" placeholder="Service / procedure" data-i="${i}" />
      <input class="bi-amt" type="number" value="${it.amt}" placeholder="₹" data-i="${i}" />
      <button class="icon-btn rm" data-action="bill-remove-item" data-i="${i}">✕</button>
    </div>`).join('');
  $$('.bi-desc').forEach(el => el.addEventListener('input', e => { billItems[e.target.dataset.i].desc = e.target.value; }));
  $$('.bi-amt').forEach(el => el.addEventListener('input', e => { billItems[e.target.dataset.i].amt = Number(e.target.value) || 0; recalcBill(); }));
  recalcBill();
}
function recalcBill() {
  const sub = billItems.reduce((s, i) => s + Number(i.amt || 0), 0);
  const disc = Number(($('#bDiscount') || {}).value || 0);
  const total = Math.max(0, sub - disc);
  const paid = Number(($('#bPaid') || {}).value || 0);
  if ($('#bSub')) $('#bSub').textContent = money(sub);
  if ($('#bDisc')) $('#bDisc').textContent = money(disc);
  if ($('#bTotal')) $('#bTotal').textContent = money(total);
  if ($('#bBal')) $('#bBal').textContent = money(Math.max(0, total - paid));
}

        ${cons && cons.diagnosis ? `<div class="rx-sec"><h4>Clinical Diagnosis</h4><div style="font-size:13.5px">${esc(cons.diagnosis)}</div></div>` : ''}`;

        <b>Patient:</b> ${esc(p.name)} (${esc(p.id)})<br>
        <b>Date:</b> ${today}</div>

  $('#printArea').innerHTML = `
  <div class="rx">
    ${clinicHeaderHTML(`Date: <b>${today}</b>`)}

      <div class="sig"><div class="line"></div><small><b>${esc(s.doctor)}</b><br>${esc(s.qualification)}<br>Reg. No: ${esc(s.regNo)}</small></div>
